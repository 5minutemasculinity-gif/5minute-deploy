workflows:
  upload-to-app-store:
    name: Upload IPA to App Store Connect
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        IPA_URL: "https://github.com/5minutemasculinity-gif/5minute-deploy/releases/download/v1.0/App.8.ipa"
    scripts:
      - name: Download IPA
        script: |
          echo "Downloading IPA from GitHub..."
          curl -L "$IPA_URL" -o /tmp/app.ipa
          FILE_SIZE=$(stat -f%z /tmp/app.ipa 2>/dev/null || stat -c%s /tmp/app.ipa)
          echo "Downloaded: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: File too small. Download failed."
            cat /tmp/app.ipa
            exit 1
          fi
          ls -lh /tmp/app.ipa
    artifacts:
      - /tmp/app.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: false
